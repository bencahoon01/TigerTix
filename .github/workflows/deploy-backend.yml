name: Deploy Backend to Render

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Run tests
        working-directory: ./backend
        env:
          JWT_SECRET: test_jwt_secret_for_ci
        run: npm test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            backend/tests/test-results.json
            backend/tests/test-results.md
            backend/coverage/

  deploy:
    name: Trigger Render Deployment
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Notify deployment
        run: |
          echo "✅ All tests passed!"
          echo "🚀 Backend will auto-deploy on Render when pushed to main branch"
          echo "Render watches the repository and deploys automatically"
